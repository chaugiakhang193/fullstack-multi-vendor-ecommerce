# Stack quan sát chạy LOCAL — không deploy. Dùng để đo baseline và xem trace.
# Chạy:  docker compose -f docker-compose.observability.yml up -d
# Tắt:   docker compose -f docker-compose.observability.yml down
services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: obs-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP/HTTP  ← app đẩy trace vào đây
      - '4317:4317' # OTLP/gRPC
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TSDB của Prometheus. PHẢI đặt tên: image có sẵn `VOLUME /prometheus` nên
      # nếu không khai, Docker tạo volume ẨN DANH (tên là hash ngẫu nhiên) —
      # `down` xoá container là mất mối nối, `up` lại sinh volume rỗng mới và
      # toàn bộ số liệu lịch sử bay sạch.
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      # 3000 = Next.js FE, 3001 = notification-service local (xem NS .env PORT=3001)
      # → Grafana phải né sang 3002, nếu không bật NS lên là đụng cổng.
      - '3002:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasource + dashboard nạp từ repo (provisioning) chứ không bấm tay trên
      # UI: dashboard sống trong git, dựng lại máy khác là có ngay, và
      # `docker compose down -v` không làm mất.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
