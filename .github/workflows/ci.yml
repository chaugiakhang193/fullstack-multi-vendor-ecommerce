name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres tạm cho bước drift-check gen-api: BE boot cần 1 DB connect được
    # (synchronize=false, không migrate → không cần schema, chỉ cần DB tồn tại).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # fetch-depth 0: guard stamp tài liệu so diff với commit trước đó, clone nông thì
      # base sha không có trong checkout và guard sẽ tự bỏ qua.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            notification-service/package-lock.json

      # Luật tolerant: file docs đổi nội dung thì dòng `_Last updated:` của chính nó phải đổi
      # theo. Pre-commit hook đóng dấu tự động; bước này bắt máy chưa cài hook.
      - name: Check Docs Timestamp
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-docs-stamp.mjs

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Unit Tests
        run: npm test
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Check Frontend Formatting
        run: npm run format:check
        working-directory: frontend

      - name: Check Generated Drift
        run: |
          npm run gen-enums
          npm run gen-limits
          git diff --exit-code src/constants/enum.generated.ts src/constants/limits.generated.ts
        working-directory: frontend

      - name: Build Backend
        run: npm run build
        working-directory: backend

      - name: Check API Schema Drift (gen-api)
        working-directory: backend
        env:
          # Boot tối thiểu cho Swagger docs-json. Toàn bộ là GIÁ TRỊ DUMMY dùng
          # một lần trong CI — KHÔNG phải secret thật (BE chỉ bootstrap + phát
          # docs-json, không gọi Google/JWT/mail thật). DB trỏ Postgres service.
          NODE_ENV: test
          PORT: 8080
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          JWT_ACCESS_SECRET: ci-dummy-access-secret
          JWT_REFRESH_SECRET: ci-dummy-refresh-secret
          ACCESS_TOKEN_EXPIRATION: 15m
          REFRESH_TOKEN_EXPIRATION: 7d
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:8080/api/v1/auth/google/callback
          # inprocess để không kích nhánh distributed; broker vẫn non-fatal nếu thiếu.
          NOTIFICATION_MODE: inprocess
        run: |
          # Boot BE nền; trap đảm bảo LUÔN kill khi step kết thúc (kể cả diff fail).
          node dist/main &
          BE_PID=$!
          trap "kill $BE_PID 2>/dev/null || true" EXIT

          # Chờ Swagger docs-json sẵn sàng (tối đa ~60s).
          UP=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/docs-json > /dev/null 2>&1; then
              UP="yes"
              echo "Backend docs-json UP sau ~$((i*2))s"
              break
            fi
            sleep 2
          done
          if [ -z "$UP" ]; then
            echo "::error::Backend không boot được để lấy docs-json (kiểm tra env boot)."
            exit 1
          fi

          # Regen từ Swagger live rồi so với bản đã commit.
          cd ../frontend
          npm run gen-api
          if ! git diff --exit-code -- src/lib/api/api-schema.d.ts; then
            echo "::error::api-schema.d.ts LỆCH với backend Swagger. Chạy 'npm run gen-api' (frontend, BE chạy :8080) rồi commit lại."
            exit 1
          fi
          echo "api-schema.d.ts đồng bộ với backend Swagger."

      - name: Install Notification Service Dependencies
        run: npm ci
        working-directory: notification-service

      - name: Check Notification Contracts Drift
        run: |
          npm run gen-contracts
          git diff --exit-code src/contracts/*.generated.ts
        working-directory: notification-service

      - name: Build Notification Service
        run: npm run build
        working-directory: notification-service

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: search-service/go.mod
          cache-dependency-path: |
            search-service/go.sum
            chat-service/go.sum

      # sqlc sinh internal/store/**/*.go tu query.sql. Cay thu muc tren git PHAI tai tao duoc
      # bang `sqlc generate`, va truoc buoc nay chi co tri nho con nguoi canh dieu do: commit 482
      # xoa mot cau SQL nhung quen chay lai generate, nen 22 dong chet cho mot cau khong con ton
      # tai nam trong repo ba ngay, toi 485 moi lo ra. Cung ho voi buoc gen-api o tren.
      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'

      - name: Check sqlc Drift
        run: |
          (cd search-service && sqlc generate)
          (cd chat-service && sqlc generate)
          git diff --exit-code

      - name: Vet Search Service
        run: go vet ./...
        working-directory: search-service

      - name: Build Search Service
        run: go build ./...
        working-directory: search-service

      # Database RIENG cho search-service, tach khoi `postgres` (dang phuc vu buoc gen-api
      # cua backend): backend khong dung golang-migrate nen hom nay chua dung cham, nhung
      # tach san tu dau de sau nay co them service Go thu 3 cung migrate vao `postgres`
      # thi khong dam vao bang schema_migrations cua search.
      - name: Create search test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE search_ci'

      # TEST_DATABASE_URL tro toi database rieng search_ci. Khong dat bien nay thi
      # store_integration_test tu skip — dat vao de migration + SQL upsert duoc kiem
      # THAT trong CI. Test tu chan URL khong phai localhost/127.0.0.1 (no TRUNCATE
      # bang) nen khong the lo tay tro vao Neon that.
      - name: Test Search Service
        run: go test ./...
        working-directory: search-service
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/search_ci?sslmode=disable

      - name: Vet Chat Service
        run: go vet ./...
        working-directory: chat-service

      - name: Build Chat Service
        run: go build ./...
        working-directory: chat-service

      # Database RIENG cho chat-service: dung chung database `postgres` voi search se dung
      # chung bang schema_migrations cua golang-migrate — chat se thay version 5 cua search
      # va tuong minh da migrate xong.
      - name: Create chat test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE chat_ci'

      - name: Test Chat Service
        run: go test ./...
        working-directory: chat-service
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chat_ci?sslmode=disable

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          # URL giả để next build không vỡ; các fetch SSG là best-effort nên chỉ
          # cần biến hợp lệ, không cần BE chạy thật trong CI.
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Build & push Docker image BE lên GHCR — chỉ khi push lên main (bỏ qua PR).
  # Vừa là bước phát hành image, vừa là bằng chứng `docker build` xanh cho B2.
  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Driver docker-container (thay driver `docker` mặc định) để hỗ trợ
      # export cache type=gha ở bước build-push bên dưới.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Đánh thức Render redeploy ngay sau khi image mới đã lên GHCR, tránh
      # race để Render tự pull theo lịch (có thể vẫn kéo image cũ).
      # Guard trong script (không dùng `if: env.*`): env cấp step không chắc
      # đọc được trong `if` của chính nó → step có thể luôn bị skip. Kiểm tra
      # rỗng ngay trong shell cho chắc, và xử lý luôn case secret chưa set.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK chưa set — bỏ qua trigger deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Extract notification service image metadata
        id: meta-notification
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-notification
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push notification service image
        uses: docker/build-push-action@v7
        with:
          context: ./notification-service
          push: true
          tags: ${{ steps.meta-notification.outputs.tags }}
          labels: ${{ steps.meta-notification.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy (notification service)
        env:
          RENDER_DEPLOY_HOOK_NOTIFICATION: ${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_NOTIFICATION" ]; then
            echo "RENDER_DEPLOY_HOOK_NOTIFICATION chưa set — bỏ qua trigger deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_NOTIFICATION"

      - name: Extract search service image metadata
        id: meta-search
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-search
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push search service image
        uses: docker/build-push-action@v7
        with:
          context: ./search-service
          push: true
          tags: ${{ steps.meta-search.outputs.tags }}
          labels: ${{ steps.meta-search.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Service search nam o Render acc#2 (ne quota free cua acc#1) nen hook la mot
      # secret rieng. Guard rong ngay trong shell, khong dung `if: env.*` — env cap
      # step khong chac doc duoc trong `if` cua chinh no, step co the bi skip nham.
      - name: Trigger Render deploy (search service)
        env:
          RENDER_DEPLOY_HOOK_SEARCH: ${{ secrets.RENDER_DEPLOY_HOOK_SEARCH }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_SEARCH" ]; then
            echo "RENDER_DEPLOY_HOOK_SEARCH chưa set — bỏ qua trigger deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_SEARCH"

      - name: Extract chat service image metadata
        id: meta-chat
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-chat
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push chat service image
        uses: docker/build-push-action@v7
        with:
          context: ./chat-service
          push: true
          tags: ${{ steps.meta-chat.outputs.tags }}
          labels: ${{ steps.meta-chat.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Secret nay co the chua ton tai — guard rong ngay trong shell se bo qua va CI van
      # xanh. Khong dung `if: env.*` vi env cap step khong chac doc duoc trong `if` cua
      # chinh no, step co the bi skip nham.
      - name: Trigger Render deploy (chat service)
        env:
          RENDER_DEPLOY_HOOK_CHAT: ${{ secrets.RENDER_DEPLOY_HOOK_CHAT }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_CHAT" ]; then
            echo "RENDER_DEPLOY_HOOK_CHAT chưa set — bỏ qua trigger deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_CHAT"
