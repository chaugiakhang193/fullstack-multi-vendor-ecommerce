name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Check Frontend Formatting
        run: npm run format:check
        working-directory: frontend

      - name: Check Generated Drift
        run: |
          npm run gen-enums
          npm run gen-limits
          git diff --exit-code src/constants/enum.generated.ts src/constants/limits.generated.ts
        working-directory: frontend

      - name: Build Backend
        run: npm run build
        working-directory: backend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          # URL giả để next build không vỡ; các fetch SSG là best-effort nên chỉ
          # cần biến hợp lệ, không cần BE chạy thật trong CI.
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Build & push Docker image BE lên GHCR — chỉ khi push lên main (bỏ qua PR).
  # Vừa là bước phát hành image, vừa là bằng chứng `docker build` xanh cho B2.
  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
