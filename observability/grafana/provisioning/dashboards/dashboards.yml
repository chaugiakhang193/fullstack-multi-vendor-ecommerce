# Trỏ Grafana vào thư mục chứa dashboard JSON để nạp tự động lúc khởi động.
apiVersion: 1

providers:
  - name: 'observability'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
