global:
  scrape_interval: 5s # 5s cho dễ nhìn lúc chạy k6; production thường 15-30s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'monolith-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      # App chạy trên HOST (npm run start:dev), Prometheus chạy trong container
      # → phải gọi ngược ra host bằng host.docker.internal (Docker Desktop Windows/Mac).
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'monolith'

  # notification-service: metric CONSUMER (không phải HTTP RED) — số event xử lý
  # theo result, thời gian xử mỗi event, độ sâu DLQ, outbox lag. Xem
  # notification-service/src/modules/metrics.
  #
  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      # NS chạy cổng 3001 ở local (notification-service/.env → PORT=3001), KHÔNG phải 8081.
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'notification'

  # search-service: viết bằng Go (client_golang), nên là service duy nhất có CẢ HAI họ
  # metric — RED cho endpoint HTTP /search, và metric consumer cho luồng RabbitMQ (event
  # xử lý theo result, số document đang có trong index). Xem
  # search-service/internal/telemetry/metrics.go.
  - job_name: 'search-service'
    metrics_path: '/metrics'
    static_configs:
      # Cổng 8090 ở local (search-service đọc PORT trước, rồi SEARCH_HTTP_PORT, default 8090).
      - targets: ['host.docker.internal:8090']
        labels:
          service: 'search'

  # chat-service: viết bằng Go, thuần HTTP (chat 1-1 + chatbot Gemini) — không tiêu thụ
  # RabbitMQ nên chỉ có một họ metric RED, không có metric consumer như search-service.
  # Xem chat-service/internal/telemetry/metrics.go.
  - job_name: 'chat-service'
    metrics_path: '/metrics'
    static_configs:
      # Cổng 8091 ở local (chat-service đọc PORT trước, rồi CHAT_HTTP_PORT, default 8091 —
      # khác 8090 của search-service để hai service Go chạy song song không tranh cổng).
      - targets: ['host.docker.internal:8091']
        labels:
          service: 'chat'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
