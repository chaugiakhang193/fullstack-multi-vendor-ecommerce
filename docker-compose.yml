# Full stack local: `docker compose up` -> Postgres + Backend.
# Backend build từ backend/Dockerfile; migration:run:prod dựng schema từ DB trống
# (InitialSchema) rồi khởi động app. FE chạy riêng bằng `npm run dev` (trỏ
# NEXT_PUBLIC_API_URL vào http://localhost:8080/api/v1).
#
# Biến DB lấy từ .env (xem .env.docker.example), có default để chạy ngay không cần .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI (guest/guest)
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Secret app (JWT / Cloudinary / Mail / Google OAuth / Geocoding) lấy từ file
    # này; các biến DB + NODE_ENV bên dưới ghi đè để trỏ vào service `db`.
    env_file:
      - ./backend/.env
    environment:
      # NODE_ENV=development => code tắt SSL Postgres (Postgres local không có SSL).
      NODE_ENV: development
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ecommerce}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
      - '8080:8080'

  notification:
    build:
      context: ./notification-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'

volumes:
  pgdata:
